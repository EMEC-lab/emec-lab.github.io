<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="">
  <link rel="icon" type="image/png" sizes="32x32" href="images/logo/emec-mark-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="images/logo/emec-mark-16.png">
  <link rel="apple-touch-icon" href="images/logo/emec-mark-180.png">

  <!-- 제목은 common.js 가 SITE.menu 값으로 덮어쓴다 -->
  <title>Lab Homepage</title>

  <!-- 로드 순서 고정: Tailwind CDN → theme.js → custom.css -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/custom.css">
</head>
<body data-page="research" class="bg-white font-sans text-slate-800 antialiased">

  <!-- 헤더: js/common.js 가 주입한다. 직접 작성하지 말 것 -->
  <div id="site-header"></div>

  <main id="content">

    <!-- 페이지 제목 밴드: common.js 가 SITE.menu 에서 채운다 -->
    <div id="page-head"></div>

    <!-- 섹션 탭 : render.js 가 그린다. 한 번에 한 섹션만 보인다 -->
    <div id="page-tabs"></div>

    <!-- ===== 연구분야 =====
         RESEARCH 각 항목이 자기 id 를 앵커로 갖는다 (research.html#machine-design 등) -->
    <section id="areas" class="scroll-mt-32">
      <div class="mx-auto max-w-6xl px-4 py-14 sm:px-6 sm:py-16 lg:px-8">
        <!-- 전체 개관 — 다섯 분야가 서로 어떻게 이어지는지 보여 주는 그림.
             그림이 준비되면 아래 자리표시 div 를 지우고 img 주석을 풀면 된다 -->
        <h2 class="text-2xl font-bold tracking-tight text-slate-900 sm:text-3xl"
            data-section-title="overview"></h2>

        <div class="reveal mt-8">
          <!--
          <img src="images/research/overview.svg" alt="" loading="lazy"
               class="mx-auto w-full max-w-4xl">
          -->
          <div class="img-placeholder aspect-[16/7] w-full rounded-lg px-4 text-center text-xs">
            연구분야 관계도 — 준비 중
          </div>
        </div>

        <!-- 분야별 카드. 누르면 research-area.html 로 넘어간다 -->
        <h2 class="mt-16 text-2xl font-bold tracking-tight text-slate-900 sm:text-3xl"
            data-section-title="areas"></h2>
        <div id="research-areas" class="mt-10"></div>

        <!-- 응용 대상 — 방법론 분야와 직교하는 축.
             data/research.js 의 APPLICATIONS 를 묶음별 태그로 그린다 -->
        <div id="applications" class="scroll-mt-24 mt-16 border-t border-slate-200 pt-10">
          <h2 class="text-2xl font-bold tracking-tight text-slate-900 sm:text-3xl"
              data-section-title="applications"></h2>

          <!-- 응용 영역 개관도. SVG 안에 은은한 반복 애니메이션이 들어 있다
               (회전자 회전 · 연결선 흐름 · 노드 순차 강조).
               prefers-reduced-motion 이면 SVG 안의 미디어 쿼리가 알아서 멈춘다 -->
          <div class="reveal mt-8 hidden sm:block">
            <img src="images/research/applications.svg" alt="" loading="lazy"
                 class="mx-auto w-full max-w-4xl">
          </div>

          <div id="research-applications" class="mt-10 grid gap-8 sm:grid-cols-2"></div>
        </div>
      </div>
    </section>

    <!-- ===== 연구장비 (감췄 둔 섹션) =====
         장비가 정해지면 아래 주석을 풀고 data/equipment.js 를 채우면 된다.
         함께 되살려야 하는 곳: js/common.js 의 NAV, js/render.js 의 research()

    <section id="equipment" class="scroll-mt-32">
      <div class="mx-auto max-w-6xl px-4 py-14 sm:px-6 sm:py-16 lg:px-8">
        <h2 class="text-2xl font-bold tracking-tight text-slate-900 sm:text-3xl"
            data-section-title="equipment"></h2>
        <div id="research-equipment" class="reveal-group mt-8 grid gap-5 sm:grid-cols-2 lg:grid-cols-3"></div>
      </div>
    </section>
    -->

    <!-- ===== 연구과제 =====
         진행 상태는 데이터가 아니라 endDate 로 매번 계산한다 (render.js getStatus) -->
    <section id="projects" class="scroll-mt-32">
      <div class="mx-auto max-w-6xl px-4 py-14 sm:px-6 sm:py-16 lg:px-8">
        <h2 class="text-2xl font-bold tracking-tight text-slate-900 sm:text-3xl"
            data-section-title="projects"></h2>
        <div id="research-projects" class="reveal mt-8"></div>
      </div>
    </section>

  </main>

  <!-- 푸터: js/common.js 가 주입한다. 직접 작성하지 말 것 -->
  <div id="site-footer"></div>

  <!-- 로드 순서 고정: data/*.js → js/render.js → js/common.js -->
  <script src="data/site.js"></script>
  <script src="data/research.js"></script>
  <script src="data/equipment.js"></script>
  <script src="data/projects.js"></script>
  <script src="js/render.js"></script>
  <script src="js/common.js"></script>
</body>
</html>
