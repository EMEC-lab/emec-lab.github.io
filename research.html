<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="">
  <link rel="icon" href="data:,">

  <!-- 제목은 common.js 가 SITE.menu 값으로 덮어쓴다 -->
  <title>Lab Homepage</title>

  <!-- 로드 순서 고정: Tailwind CDN -> theme.js -> custom.css -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/custom.css">
</head>
<body data-page="research" class="bg-white font-sans text-slate-800 antialiased">

  <!-- 헤더: js/common.js 가 주입한다. 직접 작성하지 말 것 -->
  <div id="site-header"></div>

  <main id="content">

    <!-- 페이지 제목 밴드: common.js 가 SITE.menu 에서 채운다 -->
    <div id="page-head"></div>

    <section id="areas" class="scroll-mt-16">
      <div class="mx-auto max-w-6xl px-4 py-14 sm:px-6 sm:py-16 lg:px-8">
        <!-- 제목 문구는 SITE.sectionTitles.areas 에서 온다 -->
        <h2 class="text-2xl font-bold tracking-tight text-slate-900 sm:text-3xl"
            data-section-title="areas"></h2>

        <!-- TODO: RESEARCH 를 주제별 카드로. 각 주제마다 description 한 문단 이상 -->
        <div id="research-areas" class="mt-8">
          <p class="text-sm text-slate-500" data-wip></p>
        </div>
      </div>
    </section>

    <section id="equipment" class="scroll-mt-16 border-t border-slate-200 bg-slate-50">
      <div class="mx-auto max-w-6xl px-4 py-14 sm:px-6 sm:py-16 lg:px-8">
        <!-- 제목 문구는 SITE.sectionTitles.equipment 에서 온다 -->
        <h2 class="text-2xl font-bold tracking-tight text-slate-900 sm:text-3xl"
            data-section-title="equipment"></h2>

        <!-- TODO: EQUIPMENT 의 장비명·사양·사진 -->
        <div id="research-equipment" class="mt-8">
          <p class="text-sm text-slate-500" data-wip></p>
        </div>
      </div>
    </section>

    <section id="projects" class="scroll-mt-16">
      <div class="mx-auto max-w-6xl px-4 py-14 sm:px-6 sm:py-16 lg:px-8">
        <!-- 제목 문구는 SITE.sectionTitles.projects 에서 온다 -->
        <h2 class="text-2xl font-bold tracking-tight text-slate-900 sm:text-3xl"
            data-section-title="projects"></h2>

        <!-- TODO: Render.sortedProjects() 사용. Ongoing/Completed 두 그룹, 빈 그룹은 소제목째 렌더링 금지. 기간은 YYYY.MM ~ YYYY.MM, 역할은 PROJECT_ROLES[p.role] -->
        <div id="research-projects" class="mt-8">
          <p class="text-sm text-slate-500" data-wip></p>
        </div>
      </div>
    </section>

  </main>

  <!-- 푸터: js/common.js 가 주입한다. 직접 작성하지 말 것 -->
  <div id="site-footer"></div>

  <!-- 로드 순서 고정: data/*.js -> js/render.js -> js/common.js -->
  <script src="data/site.js"></script>
  <script src="data/research.js"></script>
  <script src="data/equipment.js"></script>
  <script src="data/projects.js"></script>
  <script src="js/render.js"></script>
  <script src="js/common.js"></script>
</body>
</html>
