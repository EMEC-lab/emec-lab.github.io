<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="">
  <link rel="icon" type="image/png" sizes="32x32" href="images/logo/emec-mark-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="images/logo/emec-mark-16.png">
  <link rel="apple-touch-icon" href="images/logo/emec-mark-180.png">

  <!-- 제목은 common.js 가 SITE.menu 값으로 덮어쓴다 -->
  <title>Lab Homepage</title>

  <!-- 로드 순서 고정: Tailwind CDN → theme.js → custom.css -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/custom.css">
</head>
<body data-page="people" class="bg-white font-sans text-slate-800 antialiased">

  <!-- 헤더: js/common.js 가 주입한다. 직접 작성하지 말 것 -->
  <div id="site-header"></div>

  <main id="content">

    <!-- 페이지 제목 밴드: common.js 가 SITE.menu 에서 채운다 -->
    <div id="page-head"></div>

    <!-- 섹션 탭 : render.js 가 그린다. 한 번에 한 섹션만 보인다 -->
    <div id="page-tabs"></div>

    <!-- ===== 지도교수 =====
         학생과 다른 레이아웃. 사진을 크게 두고
         학력·경력·학회활동·학회회원·초청강연을 모두 노출한다 -->
    <section id="professor" class="scroll-mt-32">
      <div class="mx-auto max-w-6xl px-4 py-14 sm:px-6 sm:py-16 lg:px-8">
        <h2 class="mb-10 text-2xl font-bold tracking-tight text-slate-900 sm:text-3xl"
            data-section-title="professor"></h2>
        <div id="people-professor" class="reveal"></div>
      </div>
    </section>

    <!-- ===== 재학생 =====
         MEMBER_ROLE_ORDER 순서(박사 → 석사 → 학부)로 작은 카드 그리드 -->
    <section id="current" class="scroll-mt-32">
      <div class="mx-auto max-w-6xl px-4 py-14 sm:px-6 sm:py-16 lg:px-8">
        <h2 class="mb-8 text-2xl font-bold tracking-tight text-slate-900 sm:text-3xl"
            data-section-title="current"></h2>
        <div id="people-current"></div>
      </div>
    </section>

    <!-- ===== 졸업생 =====
         사진 없이 텍스트 목록. 졸업연도 내림차순 -->
    <section id="alumni" class="scroll-mt-32">
      <div class="mx-auto max-w-6xl px-4 py-14 sm:px-6 sm:py-16 lg:px-8">
        <h2 class="mb-8 text-2xl font-bold tracking-tight text-slate-900 sm:text-3xl"
            data-section-title="alumni"></h2>
        <div id="people-alumni"></div>
      </div>
    </section>

  </main>

  <!-- 구성원 프로필 창 : render.js 가 내용을 채우고 .is-open 으로 여닫는다.
       외부 라이브러리를 쓰지 않는다 -->
  <div id="member-modal" class="fixed inset-0 z-[60] overflow-y-auto"
       role="dialog" aria-modal="true" aria-labelledby="member-modal-name">

    <div data-mm-close class="fixed inset-0 bg-slate-900/50"></div>

    <div class="relative mx-auto my-6 w-full max-w-5xl px-4 sm:my-10">
      <div class="rounded-lg bg-white shadow-xl">
        <button type="button" data-mm-close aria-label="Close"
                class="absolute right-6 top-4 grid h-9 w-9 place-items-center rounded-full
                       text-slate-400 transition-colors hover:bg-slate-100 hover:text-slate-700">
          <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.8"
               viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/>
          </svg>
        </button>
        <div id="member-modal-body" class="px-6 py-8 sm:px-8"></div>
      </div>
    </div>
  </div>

  <!-- 푸터: js/common.js 가 주입한다. 직접 작성하지 말 것 -->
  <div id="site-footer"></div>

  <!-- 로드 순서 고정: data/*.js → js/render.js → js/common.js -->
  <script src="data/site.js"></script>
  <script src="data/members.js"></script>
  <script src="data/publications.js"></script>   <!-- 프로필 창의 참여 논문 목록 -->
  <script src="js/render.js"></script>
  <script src="js/common.js"></script>
</body>
</html>
