<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="">
  <link rel="icon" type="image/png" sizes="32x32" href="images/logo/emec-mark-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="images/logo/emec-mark-16.png">
  <link rel="apple-touch-icon" href="images/logo/emec-mark-180.png">

  <!-- 제목은 common.js 가 SITE.menu 값으로 덮어쓴다 -->
  <title>Lab Homepage</title>

  <!-- 로드 순서 고정: Tailwind CDN → theme.js → custom.css -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/custom.css">
</head>
<body data-page="publications" class="bg-white font-sans text-slate-800 antialiased">

  <!-- 헤더: js/common.js 가 주입한다. 직접 작성하지 말 것 -->
  <div id="site-header"></div>

  <main id="content">

    <!-- 페이지 제목 밴드: common.js 가 SITE.menu 에서 채운다 -->
    <div id="page-head"></div>

    <!-- 섹션 탭 [Journal] [Conference] [Patent] [Invited Talk]
         버튼과 건수는 render.js 가 PUBLICATIONS 를 집계해 만든다 -->
    <div id="page-tabs"></div>

    <!-- 종류별 섹션.
         종류 제목을 두지 않는다. render.js 가 종류마다 한 번 더 나눈 묶음을
         큰 제목으로 그리고, 그 안을 다시 연도별로 묶는다.
         항목이 없는 종류는 render.js 가 섹션째 감춘다 -->

    <section id="journal" class="scroll-mt-24">
      <div class="mx-auto max-w-6xl px-4 py-12 sm:px-6 sm:py-16 lg:px-8">
        <div id="pub-journal"></div>
      </div>
    </section>

    <section id="conference" class="scroll-mt-24">
      <div class="mx-auto max-w-6xl px-4 py-12 sm:px-6 sm:py-16 lg:px-8">
        <div id="pub-conference"></div>
      </div>
    </section>

    <section id="patent" class="scroll-mt-24">
      <div class="mx-auto max-w-6xl px-4 py-12 sm:px-6 sm:py-16 lg:px-8">
        <div id="pub-patent"></div>
      </div>
    </section>

    <!-- 초청강연. 데이터는 PUBLICATIONS 가 아니라
         members.js 의 교수 항목 talks 에 있다 (render.js 의 talksOf 참조) -->
    <section id="talk" class="scroll-mt-24">
      <div class="mx-auto max-w-6xl px-4 py-12 sm:px-6 sm:py-16 lg:px-8">
        <div id="pub-talk"></div>
      </div>
    </section>

  </main>

  <!-- 푸터: js/common.js 가 주입한다. 직접 작성하지 말 것 -->
  <div id="site-footer"></div>

  <!-- 로드 순서 고정: data/*.js → js/render.js → js/common.js -->
  <script src="data/site.js"></script>
  <script src="data/members.js"></script>
  <script src="data/publications.js"></script>
  <script src="js/render.js"></script>
  <script src="js/common.js"></script>
</body>
</html>
