<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="Pretendard, system-ui, sans-serif" role="img" aria-label="How the research areas relate: electromagnetic analysis feeds coupled-field analysis, both underpin electric machine design and technology, which leads to system-aware and data-driven design, with in-house automation running the whole loop underneath">
<style>
  @keyframes flow { to { stroke-dashoffset: -28; } }
  @keyframes glow {
    0%, 60%, 100% { fill: #ffffff; }
    15%           { fill: #E8EEF7; }
  }
  @keyframes rise {
    0%, 100% { opacity: 0.35; }
    50%      { opacity: 0.9; }
  }
  .link { animation: flow 2.2s linear infinite; }
  .card { animation: glow 10s ease-in-out infinite; }
  .card-1 { animation-delay: 0s; }
  .card-2 { animation-delay: 1.2s; }
  .card-3 { animation-delay: 2.4s; }
  .card-4 { animation-delay: 3.2s; }
  .feed { animation: rise 4s ease-in-out infinite; }
  .feed-1 { animation-delay: 0s; }
  .feed-2 { animation-delay: 0.8s; }
  .feed-3 { animation-delay: 1.6s; }
  @media (prefers-reduced-motion: reduce) {
    .link, .card, .feed { animation: none; }
  }
</style>

<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 1 L 9 5 L 0 9 z" fill="#26539C"/>
  </marker>
</defs>

<!-- 흐름선 : 해석 두 단 → 설계 → 설계 방법 -->
<path class="link" d="M 155 186 L 155 200" fill="none" stroke="#5C81BC" stroke-width="2" stroke-dasharray="1 6" stroke-linecap="round" marker-end="url(#ah)"/>
<path class="link" d="M 280 124 Q 307 124 307 146 Q 307 164 328 164" fill="none" stroke="#5C81BC" stroke-width="2" stroke-dasharray="1 6" stroke-linecap="round" marker-end="url(#ah)"/>
<path class="link" d="M 280 254 Q 307 254 307 232 Q 307 214 328 214" fill="none" stroke="#5C81BC" stroke-width="2" stroke-dasharray="1 6" stroke-linecap="round" marker-end="url(#ah)"/>
<path class="link" d="M 590 184 L 632 184" fill="none" stroke="#5C81BC" stroke-width="2" stroke-dasharray="1 6" stroke-linecap="round" marker-end="url(#ah)"/>

<!-- 해석 : 전자기 영역 -->
<rect class="card card-1" x="30" y="62" width="250" height="124" rx="10" fill="#ffffff" stroke="#26539C" stroke-width="2"/>
<text x="48" y="88" font-size="11" font-weight="700" fill="#5C81BC" letter-spacing="1.2">ANALYSIS</text>
<text x="48" y="118" font-size="14" font-weight="700" fill="#26539C">Electromagnetic Field</text>
<text x="48" y="138" font-size="14" font-weight="700" fill="#26539C">&amp; Characteristics Analysis</text>
<text x="48" y="166" font-size="11" fill="#64748b">Field · Loss · Torque · Force</text>

<!-- 해석 : 연성 영역 -->
<rect class="card card-2" x="30" y="206" width="250" height="96" rx="10" fill="#ffffff" stroke="#26539C" stroke-width="2"/>
<text x="48" y="232" font-size="11" font-weight="700" fill="#5C81BC" letter-spacing="1.2">ANALYSIS</text>
<text x="48" y="259" font-size="15" font-weight="700" fill="#26539C">Coupled-field Analysis</text>
<text x="48" y="283" font-size="11" fill="#64748b">Thermal · NVH · Structural</text>

<!-- 설계 : 기기와 요소 기술. 해석 두 장을 한 장으로 받는다 -->
<rect class="card card-3" x="334" y="118" width="256" height="132" rx="10" fill="#ffffff" stroke="#26539C" stroke-width="2"/>
<text x="352" y="144" font-size="11" font-weight="700" fill="#5C81BC" letter-spacing="1.2">DESIGN</text>
<text x="352" y="172" font-size="16" font-weight="700" fill="#26539C">Electric Machine</text>
<text x="352" y="193" font-size="16" font-weight="700" fill="#26539C">Design &amp; Technology</text>
<text x="352" y="222" font-size="11" fill="#64748b">Topology · Winding · Material · Process</text>

<!-- 설계 방법 -->
<rect class="card card-4" x="638" y="118" width="292" height="132" rx="10" fill="#ffffff" stroke="#26539C" stroke-width="2"/>
<text x="658" y="144" font-size="11" font-weight="700" fill="#5C81BC" letter-spacing="1.2">METHOD</text>
<text x="658" y="172" font-size="16" font-weight="700" fill="#26539C">System-aware &amp;</text>
<text x="658" y="193" font-size="16" font-weight="700" fill="#26539C">Data-driven Design</text>
<text x="658" y="222" font-size="11" fill="#64748b">System model · Surrogate · Robust optimization</text>

<!-- 자동화 : 위 전 과정을 떠받친다 -->
<line class="feed feed-1" x1="155" y1="344" x2="155" y2="312" stroke="#047857" stroke-width="2" stroke-dasharray="4 5" stroke-linecap="round" marker-end="url(#ah)"/>
<line class="feed feed-2" x1="462" y1="344" x2="462" y2="260" stroke="#047857" stroke-width="2" stroke-dasharray="4 5" stroke-linecap="round" marker-end="url(#ah)"/>
<line class="feed feed-3" x1="784" y1="344" x2="784" y2="260" stroke="#047857" stroke-width="2" stroke-dasharray="4 5" stroke-linecap="round" marker-end="url(#ah)"/>

<rect x="30" y="352" width="900" height="72" rx="10" fill="#26539C"/>
<text x="52" y="382" font-size="11" font-weight="700" fill="#9DB6DC" letter-spacing="1.2">AUTOMATION</text>
<text x="52" y="405" font-size="16" font-weight="700" fill="#ffffff">Design Automation &amp; In-house Software</text>
<text x="908" y="405" font-size="11.5" fill="#C7D6EC" text-anchor="end">Parametric modeling · Batch analysis · In-house programs</text>
</svg>
