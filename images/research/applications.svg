<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="Pretendard, system-ui, sans-serif" role="img" aria-label="Application domains of EMEC research">
<style>
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes flow { to { stroke-dashoffset: -28; } }
  @keyframes glow {
    0%, 55%, 100% { fill: white; }
    12%           { fill: #E8EEF7; }
  }
  .rotor {
    animation: spin 14s linear infinite;
    transform-origin: 480px 200px;
  }
  .link { animation: flow 2.2s linear infinite; }
  .halo { animation: glow 8s ease-in-out infinite; }
  .halo-1 { animation-delay: 0s; }
  .halo-2 { animation-delay: 2s; }
  .halo-3 { animation-delay: 4s; }
  .halo-4 { animation-delay: 6s; }
  @media (prefers-reduced-motion: reduce) {
    .rotor, .link, .halo { animation: none; }
  }
</style>
