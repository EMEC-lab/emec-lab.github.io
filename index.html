<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="">
  <link rel="icon" type="image/png" sizes="32x32" href="images/logo/emec-mark-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="images/logo/emec-mark-16.png">
  <link rel="apple-touch-icon" href="images/logo/emec-mark-180.png">

  <!-- 제목은 common.js 가 SITE 값으로 덮어쓴다 -->
  <title>Lab Homepage</title>

  <!-- 로드 순서 고정: Tailwind CDN → theme.js → custom.css -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/custom.css">
</head>
<body data-page="home" class="bg-white font-sans text-slate-800 antialiased">

  <!-- 헤더: js/common.js 가 주입한다. 직접 작성하지 말 것 -->
  <div id="site-header"></div>

  <main id="content">

    <!-- ===== 1. 히어로 =====
         영상: images/hero.mp4  /  정지 이미지: images/hero-poster.jpg
         muted·playsinline 이 없으면 모바일에서 자동 재생이 차단된다.
         768px 미만과 prefers-reduced-motion 에서는 css/custom.css 가
         영상을 숨기고 정지 이미지로 대체한다. -->
    <section id="hero" class="relative h-[calc(100svh-4rem)] min-h-[30rem] overflow-hidden bg-primary-dark">

      <video class="hero-video absolute inset-0 h-full w-full object-cover"
             autoplay muted loop playsinline
             poster="images/hero-poster.jpg">
        <source src="images/hero.mp4" type="video/mp4">
      </video>

      <img class="hero-still absolute inset-0 h-full w-full object-cover"
           src="images/hero-poster.jpg" alt="" loading="lazy" data-fallback>

      <!-- 오버레이: 영상 위 텍스트 가독성 확보용. 없이 텍스트를 얹지 않는다 -->
      <div class="absolute inset-0 bg-black/50"></div>

      <div class="relative z-10 flex h-full items-center">
        <div class="mx-auto w-full max-w-6xl px-4 sm:px-6 lg:px-8">
          <h1 data-hero-title
              class="max-w-4xl text-3xl font-bold leading-tight tracking-tight text-white sm:text-5xl lg:text-6xl"></h1>
          <p data-hero-tagline
             class="mt-6 max-w-3xl text-base leading-relaxed text-white/85 sm:text-lg"></p>
        </div>
      </div>

      <a href="#research"
         class="absolute inset-x-0 bottom-8 z-10 mx-auto flex w-max flex-col items-center gap-2 text-white/75 transition-colors hover:text-white">
        <span data-hero-scroll class="text-[11px] font-semibold uppercase tracking-wider2"></span>
        <svg class="scroll-arrow h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.5"
             viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 13.5 12 21m0 0-7.5-7.5M12 21V3"/>
        </svg>
      </a>
    </section>

    <!-- ===== 2. 연구분야 요약 ===== -->
    <section id="research" class="scroll-mt-16 bg-white">
      <div class="mx-auto max-w-6xl px-4 py-16 sm:px-6 sm:py-24 lg:px-8">
        <div id="home-research-head"></div>
        <!-- render.js 가 RESEARCH 로 채운다. reveal-group = 카드마다 0.1초 시차 -->
        <!-- 한 줄에 두 장씩(2x2). 분야가 홀수가 되면 flex wrap 이
             마지막 한 장을 가운데로 모아 준다 -->
        <div id="home-research" class="reveal-group mt-8 flex flex-wrap justify-center gap-5"></div>
      </div>
    </section>

    <!-- ===== 5. 최근 소식 ===== -->
    <section id="news" class="scroll-mt-16 border-y border-slate-200 bg-slate-50">
      <div class="mx-auto max-w-6xl px-4 py-16 sm:px-6 sm:py-24 lg:px-8">
        <div id="home-news-head"></div>
        <div id="home-news" class="mt-6"></div>
      </div>
    </section>

    <!-- ===== 감춘 섹션 =====
         지도교수 소개 · 현황 지표 · 최근 논문을 메인에서 내렸다.
         다시 보이게 하려면 아래 주석만 풀면 된다.
         (render.js 의 그리는 함수는 그대로 남아 있고,
          담을 자리가 없으면 아무 일도 하지 않는다)

    <!-- ===== 3. 지도교수 소개 ===== - ->
    <section id="professor" class="scroll-mt-16 border-y border-slate-200 bg-slate-50">
      <div class="mx-auto max-w-6xl px-4 py-16 sm:px-6 sm:py-24 lg:px-8">
        <div id="home-professor-head"></div>
        <!-- render.js 가 MEMBERS 의 role: 'professor' 를 찾아 채운다 - ->
        <div id="home-professor" class="mt-8"></div>
      </div>
    </section>

    <!-- ===== 4. 현황 지표 (숫자는 전부 자동 집계 + 카운트업) ===== - ->
    <section id="stats" class="scroll-mt-16 bg-white">
      <div class="mx-auto max-w-6xl px-4 py-16 sm:px-6 sm:py-24 lg:px-8">
        <div id="home-stats-head"></div>
        <div id="home-stats" class="reveal-group mt-8 grid grid-cols-2 gap-4 sm:grid-cols-4"></div>
      </div>
    </section>

    <!-- ===== 6. 최근 논문 ===== - ->
    <section id="papers" class="scroll-mt-16 bg-white">
      <div class="mx-auto max-w-6xl px-4 py-16 sm:px-6 sm:py-24 lg:px-8">
        <div id="home-papers-head"></div>
        <div id="home-papers" class="mt-6"></div>
      </div>
    </section>

    ===== 감춘 섹션 끝 ===== -->

    <!-- ===== 함께하실 분 =====
         위 섹션(연구분야·최근 소식)과 같은 골격을 쓴다.
         제목줄은 render.js 의 sectionHead 가 그린다 -->
    <section id="join" class="scroll-mt-16 bg-white">
      <div class="mx-auto max-w-6xl px-4 py-16 sm:px-6 sm:py-24 lg:px-8">
        <div id="home-join-head"></div>
        <div id="home-join" class="mt-6"></div>
      </div>
    </section>

  </main>

  <!-- 푸터: js/common.js 가 주입한다. 직접 작성하지 말 것 -->
  <div id="site-footer"></div>

  <!-- 로드 순서 고정: data/*.js → js/render.js → js/common.js -->
  <script src="data/site.js"></script>
  <script src="data/members.js"></script>
  <script src="data/research.js"></script>
  <script src="data/publications.js"></script>
  <script src="data/projects.js"></script>
  <script src="data/news.js"></script>
  <script src="js/render.js"></script>
  <script src="js/common.js"></script>
</body>
</html>
